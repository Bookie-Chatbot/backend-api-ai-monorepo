name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [ api-server, ai-service ]   # 두 앱을 
병렬 테스트
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: "3.10"

    - name: Install Poetry
      run: pip install poetry

    - name: Install deps (workspace)
      run: |
        poetry config virtualenvs.create false
        poetry install --no-root --sync

    - name: Run PyTest
      run: |
        cd apps/${{ matrix.service }}
        poetry run pytest -q

